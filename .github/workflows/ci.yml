name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. pnpm/action-setup rejects the version
      # being specified twice, and `packageManager` in package.json is the copy
      # that has to stay — corepack reads it locally, so it is what actually
      # pins the version contributors run. Setting both failed every run on
      # main from #42 onward, in ten seconds, before a single test executed.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Deliberately no `next build` step: building apps/blog reads the database
      # to prerender posts and to generate redirects, and CI has no Supabase
      # project. Typecheck plus the unit suite is what can be verified here
      # honestly; the build is verified on Vercel against the real project.
